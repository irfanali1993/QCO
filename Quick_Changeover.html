<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hirdaramani Bangladesh – Quick Changeover</title>
<style>
:root{--brand:#2e3192;--brand-d:#1f2275;--brand-l:#eceefb;--line:#dfe2ee;--txt:#1b1d33;--mut:#686c85}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",Inter,Roboto,Arial,sans-serif;background:#f4f5fa;color:var(--txt);-webkit-font-smoothing:antialiased}
#home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px;text-align:center;
  background:radial-gradient(circle at 50% 0%,#fff 0%,#f4f5fa 60%)}
#home img{height:150px;display:block;margin:0 auto 18px}
#home h1{margin:0;font-size:clamp(30px,7vw,48px);font-weight:800;letter-spacing:1px;color:var(--brand);text-transform:uppercase}
#home p{margin:8px 0 34px;color:var(--mut);font-size:14px;letter-spacing:.4px}
.menu{display:grid;gap:16px;width:100%;max-width:460px}
.opt{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;border:0;border-radius:14px;background:var(--brand);color:#fff;
  font:inherit;font-size:17px;font-weight:700;text-align:left;cursor:pointer;box-shadow:0 4px 14px rgba(46,49,146,.3);transition:transform .1s,background .15s}
.opt:hover{background:var(--brand-d)}.opt:active{transform:scale(.98)}
.opt i{font-style:normal;flex:none;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:20px;font-weight:800}
.opt span small{display:block;font-weight:500;font-size:12.5px;opacity:.8;margin-top:2px}
footer{margin-top:34px;font-size:12px;color:var(--mut)}
#app{display:none;flex-direction:column;height:100vh;height:100dvh}
#top{flex:none;display:flex;align-items:center;gap:12px;padding:6px 12px;background:#fff;border-bottom:2px solid var(--brand)}
#top button{border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:7px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
#top button:hover{background:var(--brand-l)}
#top b{color:var(--brand);font-size:13.5px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#frames{flex:1;position:relative;min-height:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
</style>
</head>

ailability of Issue\",\"Production\"],\n[\"3.1\",\"Unavailability of pattern\",\"Production\"],[\"3.2\",\"Meeting (Production)\",\"Production\"],[\"3.3\",\"Decision pending\",\"Quality\"],\n[\"3.4\",\"Meeting (Quality)\",\"Quality\"],[\"3.5\",\"Unavailability of trims\",\"Store\"],[\"3.6\",\"Measurement gauge make & attach\",\"Technician\"],\n[\"3.7\",\"Teach the Operator\",\"Technician\"],[\"3.8\",\"Pattern Setup & Adjustment\",\"Technician\"],[\"3.9\",\"Unavailability of controller\",\"Quality\"],[\"4.1\",\"Unavailability of technician\",\"Technician\"]];\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nlet data=null;\n\n\n$('today').textContent=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});\n// calendar default = today\n(function(){const d=new Date();$('date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();\n\nfunction consumed(s,f){\n  if(!s||!f)return '';\n  const [sh,sm]=s.split(':').map(Number),[fh,fm]=f.split(':').map(Number);\n  let d=(fh*60+fm)-(sh*60+sm); if(d<0)d+=1440; return d;\n}\nfunction addRow(){\n  const tb=$('ops').tBodies[0],tr=document.createElement('tr');\n  tr.innerHTML=`<td class=\"no\"><\/td>\n   <td class=\"c-w\" data-l=\"Operation Name\"><input class=\"opn\" type=\"text\" placeholder=\"Operation name\"><\/td>\n   <td class=\"c-w\" data-l=\"Code No\"><select class=\"code\"><option value=\"\">Select code (all codes listed)<\/option>${CODES.map(c=>`<option value=\"${c[0]}\">${c[0]} – ${esc(c[1])} (${c[2]})<\/option>`).join('')}<\/select><\/td>\n   <td data-l=\"Category\"><input class=\"cat\" readonly tabindex=\"-1\"><\/td>\n   <td data-l=\"Department\"><input class=\"dep\" readonly tabindex=\"-1\"><\/td>\n   <td data-l=\"Start Time\"><input class=\"st\" type=\"time\"><\/td>\n   <td data-l=\"Finish Time\"><input class=\"fn\" type=\"time\"><\/td>\n   <td data-l=\"Consumed (Min)\"><input class=\"cons\" readonly tabindex=\"-1\"><\/td>\n   <td class=\"c-x\"><button class=\"btn x\" type=\"button\" title=\"Remove\">✕<\/button><\/td>`;\n  tb.appendChild(tr);\n  const code=tr.querySelector('.code'),st=tr.querySelector('.st'),fn=tr.querySelector('.fn');\n  code.onchange=()=>{const c=CODES.find(x=>x[0]===code.value);tr.querySelector('.cat').value=c?c[1]:'';tr.querySelector('.dep').value=c?c[2]:'';clr(tr)};\n  const calc=()=>{tr.querySelector('.cons').value=consumed(st.value,fn.value);total();clr(tr)};\n  st.oninput=fn.oninput=calc;[tr.querySelector('.opn'),code,st,fn].forEach(addMic);\n  tr.querySelector('.x').onclick=()=>{if(tb.rows.length>1){tr.remove();renum();total();save()}};\n  tr.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',()=>e.classList.remove('bad')));\n  renum();\n}\nfunction clr(tr){tr.querySelectorAll('.bad').forEach(e=>{if(e.value)e.classList.remove('bad')})}\nfunction renum(){[...$('ops').tBodies[0].rows].forEach((r,i)=>r.querySelector('.no').textContent=i+1)}\nfunction total(){let t=0;[...$('ops').tBodies[0].rows].forEach(r=>{const v=r.querySelector('.cons').value;if(v!=='')t+=+v});$('opsTotal').textContent=t}\n$('more').onclick=()=>{addRow();save()};\n\ndocument.querySelectorAll('#p1 .grid input,#p2 input').forEach(e=>e.addEventListener('input',()=>e.classList.remove('bad')));\n\nlet curPage=1;\nfunction show(n){curPage=n;save();\n  [1,2,3].forEach(i=>{$('p'+i).classList.toggle('on',i===n);$('s'+i).classList.toggle('on',i===n);$('s'+i).classList.toggle('done',i<n);$('s'+i).querySelector('i').textContent=i<n?'✓':i});\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction needFilled(els){let ok=true;els.forEach(e=>{if(String(e.value).trim()===''){e.classList.add('bad');ok=false}});return ok}\n\n$('next1').onclick=()=>{\n  const hdr=['category','date','line','prevStyle','prevSmv','qty','feedStyle','feedSmv'].map($);\n  let ok=needFilled(hdr);\n  [...$('ops').tBodies[0].rows].forEach(r=>{ if(!needFilled([...r.querySelectorAll('.opn,.code,.st,.fn')]))ok=false });\n  if(!ok){$('msg1').textContent='⚠ Please fill all the blank (red) fields before clicking Next.';return}\n  $('msg1').textContent='';$('feedTime').value=$('opsTotal').textContent;autoCO();show(2);\n};\n$('back2').onclick=()=>show(1);\nconst autoCO=()=>{const l=$('lastGood').value,f=$('firstGood').value;$('changeover').value=(l&&f)?consumed(l,f):'';if(l&&f)$('changeover').classList.remove('bad')};\n$('lastGood').oninput=$('firstGood').oninput=autoCO;\n\n$('submit').onclick=()=>{\n  if(!needFilled(['lastGood','firstGood','changeover'].map($))){$('msg2').textContent='⚠ Please fill all the blank (red) fields.';return}\n  $('msg2').textContent='';\n  data={\n    category:$('category').value,date:$('date').value,line:$('line').value.trim(),prevStyle:$('prevStyle').value.trim(),prevSmv:+$('prevSmv').value,\n    qty:+$('qty').value,feedStyle:$('feedStyle').value.trim(),feedSmv:+$('feedSmv').value,feedTime:+$('feedTime').value,\n    lastGood:$('lastGood').value,firstGood:$('firstGood').value,changeover:+$('changeover').value,\n    ops:[...$('ops').tBodies[0].rows].map(r=>({name:r.querySelector('.opn').value.trim(),code:r.querySelector('.code').value,\n      cat:r.querySelector('.cat').value,dep:r.querySelector('.dep').value,st:r.querySelector('.st').value,fn:r.querySelector('.fn').value,cons:+r.querySelector('.cons').value}))\n  };\n  render();submitted=true;show(3);\n  try{downloadPdf([data]);$('msg3').textContent='✔ Submitted. PDF report has been downloaded automatically.'}\n  catch(e){$('msg3').style.color='#d93636';$('msg3').textContent='Submitted, but PDF generation failed: '+e.message}\n};\nfunction fmtDate(d){const [y,m,dd]=d.split('-');return dd+'-'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]+'-'+y}\nfunction render(){\n  const D=data,items=[['Category',D.category],['Date',fmtDate(D.date)],['Line No',D.line],['Previous Style',D.prevStyle],['Previous Style SMV',D.prevSmv],\n    ['Order Quantity',D.qty],['Feeding Style No',D.feedStyle],['Feeding Style SMV',D.feedSmv],['Total Feeding Time (Min)',D.feedTime],\n    ['Last Good Pcs Out Time (Previous Style)',D.lastGood],['First Good Pcs Out Time (New Style)',D.firstGood],['Changeover Time (Min)',D.changeover]];\n  const tot=D.ops.reduce((a,o)=>a+o.cons,0);\n  $('kpis').innerHTML=`<div class=\"kpi hi\"><span>Changeover Time<\/span><b>${D.changeover}<\/b><small>min<\/small><\/div><div class=\"kpi\"><span>Total Feeding Time<\/span><b>${D.feedTime}<\/b><small>min<\/small><\/div><div class=\"kpi\"><span>Operations<\/span><b>${D.ops.length}<\/b><\/div><div class=\"kpi\"><span>Line<\/span><b style=\"font-size:22px\">${esc(D.line)}<\/b><\/div>`;\n  const COL={Red:'#e03131',Blue:'#1c64f2',Yellow:'#f5c400',Green:'#2f9e44',Pink:'#f06595'};\n  $('kv').innerHTML=items.map(i=>`<div><span>${i[0]}<\/span><b>${i[0]==='Category'?`<span style=\"display:inline-block;width:11px;height:11px;border-radius:50%;background:${COL[i[1]]};margin-right:7px;vertical-align:-1px\"><\/span>`:''}${esc(i[1])}<\/b><\/div>`).join('');\n  charts(D);\n  $('sumOps').tBodies[0].innerHTML=D.ops.map((o,i)=>`<tr><td>${i+1}<\/td><td>${esc(o.name)}<\/td><td>${o.code}<\/td><td>${esc(o.cat)}<\/td><td><span class=\"chip\">${o.dep}<\/span><\/td><td>${o.st}<\/td><td>${o.fn}<\/td><td>${o.cons}<\/td><\/tr>`).join('');\n  $('sumOps').tFoot.innerHTML=`<tr class=\"tot\"><td colspan=\"7\" style=\"text-align:right\">Total Consumed Time (Min)<\/td><td>${D.ops.reduce((a,o)=>a+o.cons,0)}<\/td><\/tr>`;\n}\n$('edit').onclick=()=>{submitted=false;show(1)};\n$('dlp').onclick=()=>{try{downloadPdf([data])}catch(e){alert(e.message)}};\n$('dla').onclick=()=>{try{recs[act]=getState();downloadPdf(recs.filter(r=>r.submitted&&r.data).map(r=>r.data))}catch(e){alert(e.message)}};\n$('print').onclick=()=>window.print();\n$('new').onclick=()=>newRec();\n\n/* ---------- charts ---------- */\nfunction agg(D){const d={},c={};D.ops.forEach(o=>{d[o.dep]=(d[o.dep]||0)+o.cons;c[o.cat]=(c[o.cat]||0)+o.cons});\n  const f=m=>Object.entries(m).sort((a,b)=>b[1]-a[1]);return {dep:f(d),cat:f(c)}}\nfunction charts(D){\n  const A=agg(D),tot=D.ops.reduce((a,o)=>a+o.cons,0)||1,mx=A.dep[0]?A.dep[0][1]||1:1;\n  $('depChart').innerHTML=A.dep.map(([n,v])=>`<div class=\"hb\"><div class=\"hl\">${esc(n)}<\/div><div class=\"ht\"><div class=\"hf\" style=\"width:${v/mx*100}%\"><\/div><\/div><div class=\"hv\">${v} min · ${Math.round(v/tot*100)}%<\/div><\/div>`).join('');\n  const n=A.cat.length,L=46,R=594,T=18,B=230,pw=R-L,ph=B-T,sl=pw/n,bw=Math.min(sl*.62,46);\n  let g='',cum=0,pts=[],bars='';\n  for(let k=0;k<=5;k++){const y=B-ph*k/5;g+=`<line x1=\"${L}\" x2=\"${R}\" y1=\"${y}\" y2=\"${y}\" stroke=\"#e3e5f0\"/><text x=\"${L-6}\" y=\"${y+3}\" font-size=\"10\" text-anchor=\"end\" fill=\"#555\">${Math.round(tot*k/5)}<\/text><text x=\"${R+6}\" y=\"${y+3}\" font-size=\"10\" fill=\"#e8590c\">${k*20}%<\/text>`}\n  g+=`<line x1=\"${L}\" x2=\"${R}\" y1=\"${B-ph*.8}\" y2=\"${B-ph*.8}\" stroke=\"#e8590c\" stroke-dasharray=\"4 3\" opacity=\".5\"/>`;\n  A.cat.forEach(([nm,v],i)=>{const x=L+sl*i+sl/2,h=ph*v/tot;cum+=v;const cy=B-ph*cum/tot;pts.push([x,cy]);\n    bars+=`<rect x=\"${x-bw/2}\" y=\"${B-h}\" width=\"${bw}\" height=\"${h}\" fill=\"#2e3192\" rx=\"2\"><title>${esc(nm)}: ${v} min<\/title><\/rect><text x=\"${x}\" y=\"${B-h-4}\" font-size=\"10\" text-anchor=\"middle\" fill=\"#2e3192\" font-weight=\"700\">${v}<\/text>`+\n    `<text transform=\"translate(${x+4},${B+12}) rotate(-38)\" font-size=\"10\" text-anchor=\"end\" fill=\"#333\">${esc(nm.length>26?nm.slice(0,25)+'…':nm)}<\/text>`});\n  const line=`<polyline points=\"${pts.map(p=>p.join(',')).join(' ')}\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"2.2\"/>`+pts.map(p=>`<circle cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"3.4\" fill=\"#e8590c\"/>`).join('');\n  $('parChart').innerHTML=`<svg viewBox=\"0 0 640 ${B+95}\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,Arial,sans-serif\">${g}${bars}${line}<line x1=\"${L}\" x2=\"${R}\" y1=\"${B}\" y2=\"${B}\" stroke=\"#555\"/><\/svg>`;\n}\n\n/* ---------- file name: date_line_style  e.g. 17oct_07_40KC740 ---------- */\nfunction base(D){const [y,m,d]=D.date.split('-'),mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][m-1];\n  const c=t=>String(t).replace(/[^\\w-]+/g,'');return `${d}${mo}_${c(D.line)}_${c(D.feedStyle)}`}\n\n/* ---------- PDF report (offline generator) ---------- */\nfunction downloadPdf(list){\n  let D=list[0];const W=595.28,H=841.89,M=36,CW=W-2*M,BR='0.180 0.192 0.573',GR='0.42 0.43 0.52';\n  const cx=document.createElement('canvas').getContext('2d');\n  const tw=(t,z,b)=>{cx.font=(b?'bold ':'')+z+'px Arial';return cx.measureText(t).width};\n  const san=t=>String(t==null?'':t).replace(/[–—]/g,'-').replace(/[‘’]/g,\"'\").replace(/[“”]/g,'\"').replace(/[·•]/g,'-').replace(/[^\\x20-\\x7e]/g,'?');\n  const pe=t=>t.replace(/[\\\\()]/g,'\\\\$&');\n  const pages=[];let cur,y;\n  const out=c=>cur.push(c),Y=v=>(H-v).toFixed(2);\n  const rect=(x,yy,w,h,f,s)=>out(`${f?f+' rg ':''}${s?s+' RG 0.6 w ':''}${x.toFixed(2)} ${Y(yy+h)} ${w.toFixed(2)} ${h.toFixed(2)} re ${f&&s?'B':f?'f':'S'}`);\n  const txt=(x,yy,t,z,o={})=>{t=san(t);const w=tw(t,z,o.b);if(o.a==='r')x-=w;else if(o.a==='c')x-=w/2;out(`BT ${o.c||'0.1 0.1 0.2'} rg /F${o.b?2:1} ${z} Tf ${x.toFixed(2)} ${Y(yy)} Td (${pe(t)}) Tj ET`)};\n  const wrap=(t,w,z)=>{t=san(t);const L=[];let l='';t.split(' ').forEach(wd=>{const n=l?l+' '+wd:wd;if(tw(n,z)<=w||!l)l=n;else{L.push(l);l=wd}});L.push(l);return L};\n  const page=()=>{cur=[];pages.push(cur);y=M+4};\n  const need=h=>{if(y+h>H-50){page();txt(M,y+8,'Line Changeover Time Analysis - '+base(D),8,{c:GR});y+=22}};\n  page();\n  list.forEach((rec,ri)=>{D=rec;if(ri)page();\n  txt(M,y+22,'HIRDARAMANI',20,{b:1,c:BR});txt(M,y+36,'BANGLADESH',9,{b:1,c:BR});\n  txt(W-M,y+16,'LINE CHANGEOVER TIME ANALYSIS',14,{b:1,c:BR,a:'r'});\n  txt(W-M,y+30,'Report: '+base(D),9,{a:'r',b:1});txt(W-M,y+42,'Generated: '+new Date().toLocaleString('en-GB'),8,{a:'r',c:GR});\n  y+=52;rect(M,y,CW,2.5,BR);y+=16;\n  const tot=D.ops.reduce((a,o)=>a+o.cons,0),kw=(CW-20)/3;\n  [['CHANGEOVER TIME',D.changeover+' min',1],['TOTAL FEEDING TIME',D.feedTime+' min'],['OPERATIONS',String(D.ops.length)]].forEach((k,i)=>{\n    const x=M+i*(kw+10);rect(x,y,kw,46,k[2]?BR:'0.925 0.933 0.984');txt(x+10,y+16,k[0],8,{b:1,c:k[2]?'0.81 0.82 1':GR});txt(x+10,y+37,k[1],17,{b:1,c:k[2]?'1 1 1':BR})});\n  y+=62;\n  const it=[['Category',D.category],['Date',fmtDate(D.date)],['Line No',D.line],['Previous Style',D.prevStyle],['Previous Style SMV',D.prevSmv],['Order Quantity',D.qty],\n    ['Feeding Style No',D.feedStyle],['Feeding Style SMV',D.feedSmv],['Total Feeding Time (Min)',D.feedTime],['Last Good Pcs Out (Prev. Style)',D.lastGood],['First Good Pcs Out (New Style)',D.firstGood],['Changeover Time (Min)',D.changeover]];\n  it.forEach((p,i)=>{const x=M+(i%3)*CW/3,yy=y+Math.floor(i/3)*36;rect(x,yy,CW/3,36,'1 1 1','0.85 0.87 0.93');txt(x+8,yy+13,p[0],7.5,{c:GR});txt(x+8,yy+28,p[1],11,{b:1})});\n  y+=4*36+22;\n  txt(M,y,'OPERATION DETAILS',11,{b:1,c:BR});y+=8;\n  const cols=[['No',24,'c'],['Operation',136],['Code',32,'c'],['Category',116],['Department',74],['Start',40,'c'],['Finish',40,'c'],['Time (Min)',CW-462,'c']];\n  const head=()=>{need(40);rect(M,y,CW,20,BR);let x=M;cols.forEach(c=>{txt(c[2]?x+c[1]/2:x+5,y+13,c[0],8,{b:1,c:'1 1 1',a:c[2]});x+=c[1]});y+=20};\n  head();\n  D.ops.forEach((o,i)=>{const v=[i+1,o.name,o.code,o.cat,o.dep,o.st,o.fn,o.cons],ls=v.map((t,j)=>wrap(t,cols[j][1]-8,8.5)),h=Math.max(...ls.map(a=>a.length))*10.5+9;\n    if(y+h>H-50){need(h+20);head()}\n    rect(M,y,CW,h,i%2?'0.97 0.975 0.995':'1 1 1','0.88 0.89 0.94');let x=M;\n    ls.forEach((a,j)=>{a.forEach((l,k)=>txt(cols[j][2]?x+cols[j][1]/2:x+5,y+13+k*10.5,l,8.5,{a:cols[j][2]}));x+=cols[j][1]});y+=h});\n  need(24);rect(M,y,CW,22,'0.925 0.933 0.984');txt(M+CW-cols[7][1]-8,y+15,'Total Consumed Time (Min)',9,{b ;tb.appendChild(tr);eff(i)});\n$('#more').style.display=S.rows.length>=10?'none':'';addMics()}\nfunction eff(i){const r=S.rows[i],p=+r.p,m=+f('man'),v=+f('smv');$('#e'+i).textContent=(r.p!==''&&r.p!=null&&p>=0&&m>0&&v>0)?(p*v/(m*60)*100).toFixed(1)+'%':'-'}\nfunction calcT(){const m=+f('man'),v=+f('smv');const x=(m>0&&v>0)?+(1*m*60/v).toFixed(1):'';S.f.target=x;$('#tg').value=x}\nfunction calcCO(){const s=f('start'),e=f('end');let v='';if(s&&e){let d=(+e.slice(0,2)*60+ +e.slice(3))-(+s.slice(0,2)*60+ +s.slice(3));if(d<0)d+=1440;v=d}S.f.co=v;$('#co').value=v}\ndocument.addEventListener('input',e=>{const t=e.target;t.classList.remove('err');\nif(t.dataset.k){S.f[t.dataset.k]=t.value;if(['start','end'].includes(t.dataset.k))calcCO();if(['man','smv'].includes(t.dataset.k))calcT();if(t.dataset.k=='band')drawTabs();S.rows.forEach((_,i)=>eff(i))}\nelse if(t.dataset.r!==undefined){S.rows[t.dataset.r][t.dataset.c]=t.value;eff(+t.dataset.r)}else if(t.dataset.o){S.ot[t.dataset.o]=t.value;otCalc()}else return;S.done=false;save()});\n$('#more').onclick=()=>{if(S.rows.length<10){S.rows.push({});S.done=false;drawRows();save()}};\nfunction validate(){let bad=0;document.querySelectorAll('[data-k]:not([readonly]),[data-c]').forEach(el=>{if(!String(el.value).trim()){el.classList.add('err');bad++}});\ncalcCO();calcT();if(f('co')===''||f('target')==='')bad++;const x=document.querySelector('.err');if(x)x.scrollIntoView({block:'center',behavior:'smooth'});return!bad}\n$('#next').onclick=()=>{if(!validate()){$('#msg').textContent='Please fill every slot (highlighted in red) before going to the next page.';return}\n$('#msg').textContent='';S.page=3;save();otRender();show()};\n$('#back').onclick=()=>{S.page=3;save();otRender();show()};$('#backOT').onclick=()=>{S.page=1;save();show()};\n$('#toSum').onclick=()=>{let bad=0;document.querySelectorAll('[data-o]').forEach(el=>{if(!String(el.value).trim()||+el.value<0){el.classList.add('err');bad++}});if(bad){$('#msg3').textContent='Please fill all 3 OT slots before the summary.';return}$('#msg3').textContent='';S.page=2;save();summary(true)};\n$('#new').onclick=()=>closeTab(D.cur);\nfunction show(){window.scrollTo(0,0);$('#p1').classList.toggle('hide',S.page!=1);$('#p3').classList.toggle('hide',S.page!=3);$('#p2').classList.toggle('hide',S.page!=2)}\nconst OTM=60;\nfunction ots(){const r=S.rows,tot=r.reduce((a,x)=>a+ +x.p,0),av=r.length*60,man=+f('man'),smv=+f('smv'),o=S.ot||{},om=+o.m,oh=+o.h,op=+o.p,omin=oh*OTM;return{tot,av,man,smv,om,oh,op,omin,fe:(tot+op)*smv/(av*man+om*omin)*100}}\nfunction otRender(){const x=ots();$('#o_tot').value=x.tot;$('#o_av').value=x.av;$('#o_man').value=x.man;$('#o_smv').value=x.smv;['m','h','p'].forEach(k=>$('#o_'+k).value=S.ot[k]??'');otCalc()}\nfunction otCalc(){const x=ots(),o=S.ot,ok=k=>o[k]!==''&&o[k]!=null;$('#o_min').value=ok('h')?+x.omin.toFixed(1):'';$('#o_eff').value=(ok('m')&&ok('h')&&ok('p')&&isFinite(x.fe))?x.fe.toFixed(1)+'%':'-'}\nfunction calc(){const r=S.rows,x=ots(),cnt=k=>{const o={};r.forEach(y=>{const n=(y[k]||'').trim(),key=k=='r'?n.toLowerCase():n;o[key]=o[key]||{n,c:0};o[key].c++});return Object.values(o).sort((a,b)=>b.c-a.c)};\nM={...x,mins:x.av,avg:x.tot*x.smv/(x.man*x.av)*100,rs:cnt('r'),rp:cnt('s')}}\nfunction chart(cv,data,line,W,H){cv.width=W*2;cv.height=H*2;const g=cv.getContext('2d');g.scale(2,2);const L=40,R=line?44:14,T=26,B=100,pw=W-L-R,ph=H-T-B;\ng.fillStyle='#fff';g.fillRect(0,0,W,H);g.font='13px Arial';const tot=data.reduce((a,x)=>a+x.c,0),mx=Math.max(...data.map(x=>x.c));\ng.strokeStyle='#999';g.beginPath();g.moveTo(L,T);g.lineTo(L,T+ph);g.lineTo(W-R,T+ph);g.stroke();\nconst bw=pw/data.length;let cum=0,pts=[];\ndata.forEach((d,i)=>{const h=d.c/mx*ph,x=L+i*bw+bw*.15;g.fillStyle='#333996';g.fillRect(x,T+ph-h,bw*.7,h);g.fillStyle='#000';g.textAlign='center';g.fillText(d.c,x+bw*.35,T+ph-h-5);\ncum+=d.c;pts.push([x+bw*.35,T+ph-cum/tot*ph]);g.save();g.translate(x+bw*.35,T+ph+10);g.rotate(Math.PI/4);g.textAlign='left';g.fillText(d.n.length>16?d.n.slice(0,15)+'…':d.n,0,0);g.restore()});\ng.fillStyle='#000';g.textAlign='right';g.fillText(mx,L-5,T+10);g.fillText('0',L-5,T+ph);\nif(line){g.strokeStyle='#e0502d';g.fillStyle='#e0502d';g.lineWidth=2;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();pts.forEach(p=>{g.beginPath();g.arc(p[0],p[1],3,0,7);g.fill()});g.textAlign='left';g.fillText('100%',W-R+4,T+4);g.fillText('Cum. %',W-R+4,T+ph/2)}}\nfunction summary(auto){calc();show();$('#kp').innerHTML=`<div><b>${M.tot}<\/b>Total Production<\/div><div><b>${M.avg.toFixed(1)}%<\/b>Average Efficiency<\/div><div><b>${M.mins}<\/b>Total Minutes<\/div><div><b>${M.om}<\/b>OT Manpower<\/div><div><b>${M.oh}<\/b>OT Hours<\/div><div><b>${M.omin}<\/b>OT Minutes<\/div><div><b>${M.op}<\/b>OT Production<\/div><div><b>${M.fe.toFixed(1)}%<\/b>Efficiency incl. OT<\/div>`;drawCharts();if(auto)pdf()}\nfunction drawCharts(){const w=Math.max(300,Math.min(800,$('#p2').clientWidth-30)),h=w<500?320:380;chart($('#c1'),M.rs,true,w,h);chart($('#c2'),M.rp,false,w,h)}\nfunction big(d,l){const c=document.createElement('canvas');chart(c,d,l,800,380);return c.toDataURL('image/jpeg',.8)}\nlet rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.page==2&&M.rs)drawCharts()},200)});\nfunction pdf(){if(!window.jspdf){alert('PDF library could not load. Please connect to the internet and press Download PDF again.');return}calc();\nconst d=new jspdf.jsPDF({unit:'mm',format:'a4',compress:true}),W=210;d.addImage($('#lg').src,'PNG',10,8,15,21);d.setFontSize(16);d.setFont(undefined,'bold');d.text('Hirdaramani Bangladesh',W/2,16,{align:'center'});d.setFontSize(11);d.text('1st 8 Hours Achievement Report',W/2,23,{align:'center'});\nd.setFont(undefined,'normal');d.setFontSize(9);const inf=[['Date',f('date')],['Band No',f('band')],['Style No',f('style')],['Changeover Color',f('color')],['Last Good Pcs Out',f('start')],['First Good Pcs Out',f('end')],['Changeover (Min)',f('co')],['Manpower',f('man')],['SMV',f('smv')],['100% Target',f('target')]];\ninf.forEach((x,i)=>d.text(x[0]+': '+x[1],12+(i%3)*66,36+Math.floor(i/3)*6));\nlet y=62;const cx=[12,32,62,92,160];d.setFillColor(51,57,150);d.rect(10,y-5,190,7,'F');d.setTextColor(255);d.setFont(undefined,'bold');['Hour','Production','Efficiency %','Reason','Responsible'].forEach((h,i)=>d.text(h,cx[i],y));d.setTextColor(0);d.setFont(undefined,'normal');\nS.rows.forEach((r,i)=>{y+=7;d.text(ord(i+1),cx[0],y);d.text(String(r.p),cx[1],y);d.text($('#e'+i).textContent,cx[2],y);d.text(String(r.r).slice(0,36),cx[3],y);d.text(r.s,cx[4],y);d.line(10,y+2,200,y+2)});\ny+=8;d.setFont(undefined,'bold');d.text(`Total Production: ${M.tot}    Average Efficiency: ${M.avg.toFixed(1)}%    Total Minutes: ${M.mins}`,12,y);\nd.text('OT Calculation',12,y+7);d.setFont(undefined,'normal');\nd.text(`Total Production: ${M.tot}   Available Minutes: ${M.av}   Manpower: ${M.man}   SMV: ${M.smv}`,12,y+13);\nd.text(`OT Manpower: ${M.om}   OT Hours: ${M.oh}   OT Minutes: ${M.omin}   OT Hour Production: ${M.op} pcs`,12,y+19);\nd.setFont(undefined,'bold');d.text(`Efficiency incl. OT: ${M.fe.toFixed(1)}%   [(${M.tot}+${M.op}) x SMV / ((${M.av} x ${M.man}) + (${M.om} x ${M.omin})) x 100]`,12,y+25);\ny+=34;d.text('Reason Pareto Chart',12,y);d.addImage(big(M.rs,true),'JPEG',12,y+2,105,50);d.text('Responsible (Descending)',12,y+58);d.addImage(big(M.rp,false),'JPEG',12,y+60,105,50);\nconst dt=new Date(f('date')+'T00:00'),mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][dt.getMonth()];\nconst cl=s=>String(s).trim().replace(/[^\\w-]+/g,'');d.save(`${String(dt.getDate()).padStart(2,'0')}_${mo}_${cl(f('band'))}_${cl(f('style'))}.pdf`);S.done=true;save();drawTabs()}\n$('#dl').onclick=pdf;\nwindow.addEventListener('beforeunload',e=>{if(D.tabs.some(t=>!t.done&&dirty(t))){e.preventDefault();e.returnValue=''}});\nconst SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)$('#vh').style.display='none';\nconst W={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};\nfunction num(s){const tk=s.toLowerCase().replace(/,/g,'').replace(/%/g,'').replace(/\\./g,' point ').replace(/\\s+/g,' ').trim().split(' ');let ip=0,cur=0,dec='',d=false,ok=false;\nfor(const w of tk){if(w=='point'){d=true;continue}if(d){if(w in W){dec+=W[w];ok=true}else if(/^\\d+$/.test(w)){dec+=w;ok=true}continue}\nif(w in W){cur+=W[w];ok=true}else if(w=='hundred'){cur*=100;ok=true}else if(w=='thousand'){ip+=cur*1000;cur=0;ok=true}else if(/^\\d+$/.test(w)){cur+=+w;ok=true}}\nreturn ok?String(ip+cur)+(dec?'.'+dec:''):''}\nconst code=s=>s.toLowerCase().split(/\\s+/).map(w=>(w in W&&W[w]<10)?String(W[w]):(w=='dash'||w=='hyphen')?'-':w).join('').replace(/[^a-z0-9-]/g,'').toUpperCase();\nfunction conv(el,raw){const s=raw.trim();if(el.tagName=='SELECT'){const n=x=>x.toLowerCase().replace(/[^a-z0-9]/g,''),q=n(s),al={mandt:'MNT',notapplicable:'N/A'};if(al[q]&&[...el.options].some(o=>o.value==al[q]))return al[q];\nconst o=[...el.options].find(o=>o.value&&(n(o.value)==q||(o.value.length>3&&q.includes(n(o.value)))));return o?o.value:''}\nif(el.type=='number')return num(s);if(el.dataset.k=='band'||el.dataset.k=='style')return code(s);return s.charAt(0).toUpperCase()+s.slice(1)}\nfunction toast(m,ms){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>e.style.display='none',ms)}\nlet rec=null;\nfunction listen(el){if(rec){rec.stop();return}const r=rec=new SR(),b=el.nextElementSibling;r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;b.classList.add('rec');toast('🎤 Listening… speak now');\nr.onresult=ev=>{const raw=ev.results[0][0].transcript,v=conv(el,raw);if(v===''){toast('Heard “'+raw+'” – could not use it. Please try again or type.',4000);return}el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));toast('Heard: '+raw+'  →  '+v,2500)};\nr.onerror=ev=>toast(ev.error=='not-allowed'||ev.error=='service-not-allowed'?'Microphone is blocked. Allow mic access in the browser, or type instead.':'Voice not captured. Please try again or type.',4000);\nr.onend=()=>{b.classList.remove('rec');rec=null};try{r.start()}catch(e){rec=null;b.classList.remove('rec')}}\nfunction addMics(){if(!SR)return;document.querySelectorAll('input[data-k]:not([readonly]):not([type=date]):not([type=time]),select[data-k],[data-c],[data-o]').forEach(el=>{if(el.parentNode.classList.contains('mw'))return;\nconst w=document.createElement('div');w.className='mw'+(el.tagName=='SELECT'?' sel':'');el.replaceWith(w);const b=document.createElement('button');b.type='button';b.className='mic';b.textContent='🎤';b.title='Speak';w.append(el,b)})}\ndocument.addEventListener('click',e=>{const b=e.target.closest('.mic');if(b)listen(b.previousElementSibling)});\nload();loadTab();\n<\/script><\/body><\/html>\n"}};
